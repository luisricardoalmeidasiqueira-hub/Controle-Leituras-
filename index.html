<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Correção - Lançamentos por Etapa</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f6 url('papel_leitura_energia.jpeg') center top/cover fixed no-repeat;font-family:Arial,sans-serif;color:#245d2e}
body:before{content:"";position:fixed;inset:0;background:rgba(255,255,255,.78);z-index:-1}
header{padding:10px 14px 6px}
h1{margin:0;font-size:26px}
.sub{margin-top:3px;font-size:12px}
.card{background:#fff;margin:6px 10px 12px;padding:12px;border-radius:14px;box-shadow:0 2px 9px #0001}
h2{margin:0 0 10px;font-size:20px}
label{display:block;font-size:15px;font-weight:bold;margin:9px 0 5px}
input,select,button{width:100%;min-height:44px;border-radius:9px;font-size:15px;padding:8px}
input,select{border:1.5px solid #ccc;background:#fff}
button{border:0;font-weight:bold;cursor:pointer}
.save{background:#1d6829;color:white;font-size:16px;margin-top:12px}
.etapas{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.etapa{min-height:38px;padding:4px;background:#e8f1e9;color:#1d6829;border:2px solid #b9cebc;border-radius:10px;font-size:15px}
.etapa.active{background:#1d6829;color:#fff}
.section-title{font-size:23px;font-weight:bold;margin:20px 18px 10px}
.reg{border-left:6px solid #1d6829;margin:10px 0;padding:14px;background:#fff;border-radius:12px;box-shadow:0 1px 5px #0001;color:#285f31}
.reg b{font-size:19px}
.reg div{margin-top:7px;color:#315e38}
.del{margin-top:12px;background:#fff;border:2px solid #1d6829;color:#1d6829;min-height:44px}
.empty{text-align:center;color:#777;padding:20px}
.small{font-size:12px;color:#666;margin-top:10px}
</style>
</head>
<body>
<header>
<h1>Correção</h1>
<div class="sub">Acompanhamento de lançamento em FORMS</div>
</header>

<div class="card">
<h2>Novo Lançamento — <span id="etapaTitulo">Etapa 01</span></h2>

<label>Etapa</label>
<div class="etapas" id="etapas"></div>

<label>Endereço</label>
<input id="endereco" placeholder="Rua, número, bairro">

<label>Medidor</label>
<input id="medidor" placeholder="Ex: 123456">

<label>Número da UC</label>
<input id="uc" placeholder="Ex: 7891234">

<label>Leitura Corrigida</label>
<input id="leitura" type="number" inputmode="numeric" placeholder="Digite a leitura">

<label>Data da correção da Leitura</label>
<input id="data" type="date">

<button class="save" onclick="salvar()">SALVAR LANÇAMENTO</button>
<div class="small">Os lançamentos ficam separados por etapa. Ao trocar de etapa, somente os registros daquela etapa são exibidos.</div>
</div>

<div class="section-title">Acompanhamento — <span id="etapaLista">Etapa 01</span></div>
<div class="card" id="lista"></div>

<script>
let etapaAtual=1;
let registros=JSON.parse(localStorage.getItem('correcoes_etapas_1_18')||'[]');

const etapas=document.getElementById('etapas');
for(let i=1;i<=18;i++){
  const b=document.createElement('button');
  b.className='etapa';
  b.textContent='ETAPA '+String(i).padStart(2,'0');
  b.onclick=()=>selecionarEtapa(i);
  b.id='etapa'+i;
  etapas.appendChild(b);
}
document.getElementById('data').value=new Date().toISOString().slice(0,10);

function selecionarEtapa(n){
  etapaAtual=n;
  document.querySelectorAll('.etapa').forEach(x=>x.classList.remove('active'));
  document.getElementById('etapa'+n).classList.add('active');
  document.getElementById('etapaTitulo').textContent='Etapa '+String(n).padStart(2,'0');
  document.getElementById('etapaLista').textContent='Etapa '+String(n).padStart(2,'0');
  render();
}
function salvar(){
  const endereco=document.getElementById('endereco').value.trim();
  const medidor=document.getElementById('medidor').value.trim();
  const uc=document.getElementById('uc').value.trim();
  const leitura=document.getElementById('leitura').value.trim();
  const data=document.getElementById('data').value;
  if(!endereco||!medidor||!uc||!leitura){
    alert('Preencha Endereço, Medidor, UC e Leitura Corrigida.');
    return;
  }
  registros.push({id:Date.now(),etapa:etapaAtual,endereco,medidor,uc,leitura,data});
  localStorage.setItem('correcoes_etapas_1_18',JSON.stringify(registros));
  document.getElementById('endereco').value='';
  document.getElementById('medidor').value='';
  document.getElementById('uc').value='';
  document.getElementById('leitura').value='';
  document.getElementById('data').value=new Date().toISOString().slice(0,10);
  render();
}
function excluir(id){
  if(confirm('Excluir este lançamento?')){
    registros=registros.filter(r=>r.id!==id);
    localStorage.setItem('correcoes_etapas_1_18',JSON.stringify(registros));
    render();
  }
}
function formatarData(d){
  if(!d)return '';
  const p=d.split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d;
}
function render(){
  const lista=document.getElementById('lista');
  const filtrados=registros.filter(r=>r.etapa===etapaAtual);
  if(!filtrados.length){
    lista.innerHTML='<div class="empty">Nenhum lançamento na Etapa '+String(etapaAtual).padStart(2,'0')+'.</div>';
    return;
  }
  lista.innerHTML=filtrados.slice().reverse().map(r=>`
    <div class="reg">
      <b>${esc(r.endereco)}</b>
      <div>Medidor: ${esc(r.medidor)} • UC: ${esc(r.uc)}</div>
      <div><b>Leitura corrigida:</b> ${esc(r.leitura)}</div>
      <div><b>Data:</b> ${formatarData(r.data)}</div>
      <div><b>Etapa:</b> ${String(r.etapa).padStart(2,'0')}</div>
      <button class="del" onclick="excluir(${r.id})">Excluir</button>
    </div>`).join('');
}
function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
selecionarEtapa(1);
</script>
</body>
</html>
