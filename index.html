<style>
  :root{
    --navy:#16233B;
    --navy-2:#1E314F;
    --paper:#F5F3EE;
    --card:#FFFFFF;
    --ink:#1D2733;
    --muted:#6B7686;
    --line:#E1E0DA;
    --amber:#E8A33D;
    --amber-deep:#C97F1B;
    --ok:#3C7A4E;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  body{padding-bottom:40px;}

  header{
    background:var(--navy);
    color:#fff;
    padding:16px 16px 14px;
    position:sticky; top:0; z-index:20;
  }
  .brand{font-size:13px; letter-spacing:.02em; color:#9FB0C7; margin:0 0 2px;}
  h1{margin:0; font-size:19px; font-weight:700;}

  .month-bar{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:14px; background:var(--navy-2); border-radius:999px; padding:4px;
  }
  .month-bar button{
    width:38px; height:38px; border-radius:999px; border:none;
    background:transparent; color:#fff; font-size:19px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .month-bar button:active{background:rgba(255,255,255,.12);}
  .month-label{font-size:15px; font-weight:600; text-transform:capitalize; flex:1; text-align:center;}

  main{padding:14px;}

  .meter{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:14px; display:flex; gap:10px;
  }
  .meter .stat{flex:1; text-align:center;}
  .meter .stat .num{font-size:20px; font-weight:700; color:var(--navy);}
  .meter .stat.total .num{color:var(--ok);}
  .meter .stat .lbl{font-size:11px; color:var(--muted); margin-top:2px;}
  .meter .divider{width:1px; background:var(--line);}

  .etapa-selector{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:6px;
    padding:2px 2px 10px;
    margin-bottom:6px;
  }
  .etapa-chip{
    min-width:0; height:38px; padding:0 4px;
    border-radius:10px; border:1px solid var(--line); background:var(--card);
    color:var(--ink); font-size:13px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:4px;
    position:relative;
  }
  .etapa-chip .dot{
    width:5px; height:5px; border-radius:999px; background:var(--amber-deep);
    display:none;
  }
  .etapa-chip.filled .dot{display:inline-block;}
  .etapa-chip.active{
    background:var(--navy); border-color:var(--navy); color:#fff;
  }
  .etapa-chip.active .dot{background:var(--amber);}
  .etapa-chip:active{background:#F0EEE8;}
  .etapa-chip.active:active{background:var(--navy-2);}

  .etapa-row{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 12px; margin-bottom:8px;
  }
  .etapa-row.filled{border-left:3px solid var(--amber);}
  .etapa-top{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;
  }
  .etapa-num{font-size:14px; font-weight:700; color:var(--navy);}
  .etapa-top-right{display:flex; align-items:center; gap:6px;}
  .etapa-nav{display:flex; align-items:center; gap:8px;}
  .etapa-nav-btn{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--line);
    background:#FCFCFA; color:var(--navy); font-size:15px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .etapa-nav-btn:active{background:#F0EEE8;}
  .etapa-nav-btn:disabled{opacity:.35;}
  .etapa-total{font-size:12px; color:var(--ok); font-weight:600;}
  .etapa-tag{
    font-size:10px; background:var(--amber); color:#3A2A06;
    padding:2px 7px; border-radius:999px; font-weight:700; letter-spacing:.01em;
  }

  .data-field{margin-bottom:8px; max-width:160px;}
  .data-field label{display:block; font-size:10px; color:var(--muted); margin-bottom:3px;}
  .data-field input{
    width:100%; border:1px solid var(--line); border-radius:7px;
    padding:8px 6px; font-size:14px; background:#FCFCFA; color:var(--ink);
  }

  .livro-group{margin-bottom:10px;}
  .livro-group:last-child{margin-bottom:0;}
  .livro-group.marked{
    border-left:2px solid var(--amber-deep); padding-left:8px; margin-left:-10px;
  }

  .livro-line{
    display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:end;
    margin-bottom:5px;
  }
  .field label{display:block; font-size:10px; color:var(--muted); margin-bottom:3px;}
  .field input{
    width:100%; border:1px solid var(--line); border-radius:7px;
    padding:8px 6px; font-size:14px; background:#FCFCFA; color:var(--ink);
  }
  .field input:focus, .data-field input:focus{outline:none; border-color:var(--amber-deep);}
  .remove-btn{
    width:34px; height:34px; border-radius:7px; border:1px solid var(--line);
    background:#FCFCFA; color:var(--muted); font-size:16px; line-height:1;
  }
  .remove-btn:active{background:#F0EEE8;}

  .particionado-check{
    display:flex; align-items:center; gap:6px; padding-left:2px; user-select:none;
  }
  .particionado-check input[type="checkbox"]{
    width:15px; height:15px; accent-color:var(--amber-deep); flex-shrink:0;
  }
  .particionado-check span{font-size:11px; color:var(--muted);}

  .seq-fields{
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px;
  }

  .section-title{
    font-size:13px; font-weight:700; color:var(--navy); margin:22px 0 10px;
    padding-top:14px; border-top:1px solid var(--line);
  }
  table.summary{width:100%; border-collapse:collapse; background:var(--card);
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  table.summary th, table.summary td{
    padding:8px 10px; font-size:13px; text-align:left; border-bottom:1px solid var(--line);
  }
  table.summary th{background:var(--navy); color:#fff; font-weight:600; font-size:12px;}
  table.summary tr:last-child td{border-bottom:none;}
  table.summary td.qty{text-align:right; font-weight:600; color:var(--ok);}
  table.summary tr.empty td{color:var(--muted); font-style:italic;}

  .save-note{text-align:center; font-size:11px; color:var(--muted); margin-top:14px; min-height:14px;}
  .save-note.show{color:var(--ok);}
  .save-note.retry{color:var(--amber-deep);}
</style>
</head>
<body>

<header>
  <p class="brand">Controle de Leituras</p>
  <h1>Lançamento por etapa</h1>
  <div class="month-bar">
    <button id="prevMonth" aria-label="Mês anterior">‹</button>
    <div class="month-label" id="monthLabel">—</div>
    <button id="nextMonth" aria-label="Próximo mês">›</button>
  </div>
</header>

<main>
  <div class="meter">
    <div class="stat">
      <div class="num" id="statEtapas">0</div>
      <div class="lbl">etapas lançadas</div>
    </div>
    <div class="divider"></div>
    <div class="stat total">
      <div class="num" id="statTotal">0</div>
      <div class="lbl">leituras no mês</div>
    </div>
  </div>

  <div class="etapa-selector" id="etapaSelector"></div>
  <div id="etapasContainer"></div>

  <div class="section-title">Resumo por etapa</div>
  <table class="summary">
    <thead><tr><th>Etapa</th><th style="text-align:right">Leituras</th></tr></thead>
    <tbody id="summaryBody"></tbody>
  </table>

  <div class="save-note" id="saveNote">&nbsp;</div>
</main>

<script>
let current = new Date();
current.setDate(1);
let monthData = []; // 18 posições: { data, livros:[{livro,qtd,particionado}, ...] }
let selectedIdx = 0; // etapa atualmente exibida (0 a 17)

function pad(n){ return String(n).padStart(2,"0"); }
function keyFor(date){ return `leituras:${date.getFullYear()}-${pad(date.getMonth()+1)}`; }
function emptyLivro(){ return { livro:"", qtd:"", particionado:false, seqA:"", seqB:"" }; }
function emptyEtapa(){ return { data:"", livros:[ emptyLivro() ] }; }

function storageGet(key){
  return localStorage.getItem(key);
}
function storageSet(key, value){
  localStorage.setItem(key, value);
}

async function loadMonth(date){
  const key = keyFor(date);
  try{
    const value = storageGet(key);
    monthData = value ? JSON.parse(value) : [];
  }catch(e){
    monthData = [];
  }
  while(monthData.length < 18) monthData.push(emptyEtapa());
  monthData = monthData.slice(0, 18);
  monthData.forEach(d=>{
    if(!Array.isArray(d.livros) || d.livros.length === 0) d.livros = [ emptyLivro() ];
    d.livros.forEach(l=>{
      if(typeof l.particionado !== "boolean") l.particionado = false;
      if(l.seqA === undefined || l.seqA === null) l.seqA = "";
      if(l.seqB === undefined || l.seqB === null) l.seqB = "";
    });
  });
}

// --- Salvamento com espera (debounce) ---
// Evita disparar uma gravação a cada tecla digitada.
let saveDebounceTimer = null;

function scheduleSave(date){
  clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(()=> performSave(date), 600);
}

function performSave(date){
  const key = keyFor(date);
  const payload = JSON.stringify(monthData);
  try{
    storageSet(key, payload);
    flashSaved();
  }catch(e){
    console.error(e);
    flashRetry();
  }
}

function flashSaved(){
  const note = document.getElementById("saveNote");
  note.classList.remove("retry");
  note.classList.add("show");
  note.textContent = "salvo";
  clearTimeout(note._hideTimer);
  note._hideTimer = setTimeout(()=>{
    note.classList.remove("show");
    note.textContent = "\u00A0";
  }, 1200);
}

function flashRetry(){
  const note = document.getElementById("saveNote");
  note.classList.add("show", "retry");
  note.textContent = "não foi possível salvar (armazenamento cheio)";
  clearTimeout(note._hideTimer);
  note._hideTimer = setTimeout(()=>{
    note.classList.remove("show", "retry");
    note.textContent = "\u00A0";
  }, 2500);
}

function etapaTotal(etapa){
  return etapa.livros.reduce((sum, l)=> sum + (Number(l.qtd) || 0), 0);
}

function isEtapaFilled(etapa){
  return !!(etapa.data || etapa.livros.some(l=> l.livro || l.qtd));
}

function renderSelector(){
  const bar = document.getElementById("etapaSelector");
  bar.innerHTML = "";
  for(let i=0;i<18;i++){
    const etapa = monthData[i];
    const filled = isEtapaFilled(etapa);
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "etapa-chip" + (filled ? " filled" : "") + (i === selectedIdx ? " active" : "");
    chip.innerHTML = `${i+1}<span class="dot"></span>`;
    chip.addEventListener("click", ()=>{
      selectedIdx = i;
      renderSelector();
      renderEtapas();
    });
    bar.appendChild(chip);
  }
  const activeChip = bar.querySelector(".etapa-chip.active");
  if(activeChip) activeChip.scrollIntoView({ block:"nearest", inline:"center" });
}

function renderEtapas(){
  const container = document.getElementById("etapasContainer");
  container.innerHTML = "";

  const i = selectedIdx;
  const etapaNum = i+1;
  const etapa = monthData[i];
  const total = etapaTotal(etapa);
  const isFilled = isEtapaFilled(etapa);
  const hasParticionado = etapa.livros.some(l=> l.particionado);

  const row = document.createElement("div");
  row.className = "etapa-row" + (isFilled ? " filled" : "");

  let livrosHtml = "";
  etapa.livros.forEach((l)=>{
    livrosHtml += `
      <div class="livro-group${l.particionado ? " marked" : ""}">
        <div class="livro-line">
          <div class="field">
            <label>Nº do livro</label>
            <input type="text" inputmode="numeric" class="livro" value="${l.livro || ""}">
          </div>
          <div class="field">
            <label>Qtd. leituras</label>
            <input type="number" inputmode="numeric" min="0" class="qtd" value="${l.qtd || ""}">
          </div>
          ${etapa.livros.length > 1
            ? `<button type="button" class="remove-btn" title="Remover este livro">✕</button>`
            : `<span></span>`}
        </div>
        <label class="particionado-check">
          <input type="checkbox" class="particionado" ${l.particionado ? "checked" : ""}>
          <span>Livro particionado</span>
        </label>
        ${l.particionado ? `
        <div class="seq-fields">
          <div class="field">
            <label>Sequência A</label>
            <input type="text" inputmode="numeric" class="seqA" value="${l.seqA || ""}">
          </div>
          <div class="field">
            <label>Sequência B</label>
            <input type="text" inputmode="numeric" class="seqB" value="${l.seqB || ""}">
          </div>
        </div>` : ""}
      </div>`;
  });

  row.innerHTML = `
    <div class="etapa-top">
      <div class="etapa-nav">
        <button type="button" class="etapa-nav-btn" id="etapaPrev" ${i === 0 ? "disabled" : ""} title="Etapa anterior">‹</button>
        <span class="etapa-num">Etapa ${etapaNum}</span>
        <button type="button" class="etapa-nav-btn" id="etapaNext" ${i === 17 ? "disabled" : ""} title="Próxima etapa">›</button>
      </div>
      <span class="etapa-top-right">
        ${hasParticionado ? `<span class="etapa-tag">particionado</span>` : ""}
        ${total > 0 ? `<span class="etapa-total">${total} leituras</span>` : ""}
      </span>
    </div>
    <div class="data-field">
      <label>Data</label>
      <input type="date" class="data" value="${etapa.data || ""}">
    </div>
    <div class="livros-list">${livrosHtml}</div>
  `;
  container.appendChild(row);

  row.dataset.idx = i;

  row.querySelector(".data").addEventListener("input", onDataChange);
  row.querySelectorAll(".livro, .qtd, .seqA, .seqB").forEach(el=>{
    el.addEventListener("input", onLivroChange);
  });
  row.querySelectorAll(".particionado").forEach(el=>{
    el.addEventListener("change", onParticionadoChange);
  });
  row.querySelectorAll(".remove-btn").forEach(btn=>{
    btn.addEventListener("click", onRemoveLivro);
  });

  const prevBtn = row.querySelector("#etapaPrev");
  const nextBtn = row.querySelector("#etapaNext");
  if(prevBtn) prevBtn.addEventListener("click", ()=>{
    if(selectedIdx > 0){ selectedIdx--; renderSelector(); renderEtapas(); }
  });
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    if(selectedIdx < 17){ selectedIdx++; renderSelector(); renderEtapas(); }
  });
}

function onDataChange(e){
  const idx = Number(e.target.closest(".etapa-row").dataset.idx);
  monthData[idx].data = e.target.value;
  updateFilledState(idx);
  updateChipState(idx);
  scheduleSave(current);
}

function updateChipState(idx){
  const bar = document.getElementById("etapaSelector");
  const chip = bar.children[idx];
  if(!chip) return;
  chip.classList.toggle("filled", isEtapaFilled(monthData[idx]));
}

function onLivroChange(e){
  const rowEl = e.target.closest(".etapa-row");
  const idx = Number(rowEl.dataset.idx);
  const etapa = monthData[idx];
  const prevLivros = etapa.livros;
  const focusedInput = e.target;
  const focusedClass = Array.from(focusedInput.classList).find(c=> ["livro","qtd","seqA","seqB"].includes(c));
  const groups = Array.from(rowEl.querySelectorAll(".livro-group"));
  const focusedGroupIdx = groups.indexOf(focusedInput.closest(".livro-group"));
  const caretPos = focusedInput.selectionStart;

  etapa.livros = groups.map((grp, li)=>{
    const seqAEl = grp.querySelector(".seqA");
    const seqBEl = grp.querySelector(".seqB");
    return {
      livro: grp.querySelector(".livro").value.trim(),
      qtd: grp.querySelector(".qtd").value === "" ? "" : Number(grp.querySelector(".qtd").value),
      particionado: grp.querySelector(".particionado").checked,
      seqA: seqAEl ? seqAEl.value.trim() : (prevLivros[li] ? prevLivros[li].seqA || "" : ""),
      seqB: seqBEl ? seqBEl.value.trim() : (prevLivros[li] ? prevLivros[li].seqB || "" : "")
    };
  });

  const last = etapa.livros[etapa.livros.length - 1];
  let needsRerender = false;
  if(last.livro || last.qtd){
    etapa.livros.push(emptyLivro());
    needsRerender = true;
  }

  updateFilledState(idx);
  updateChipState(idx);
  renderSummary();

  if(needsRerender){
    renderEtapas();
    const newRowEl = document.querySelector(`.etapa-row[data-idx="${idx}"]`);
    const newGroups = newRowEl ? Array.from(newRowEl.querySelectorAll(".livro-group")) : [];
    const newGrp = newGroups[focusedGroupIdx];
    const newInput = newGrp ? newGrp.querySelector(`.${focusedClass}`) : null;
    if(newInput){
      newInput.focus();
      if(typeof caretPos === "number" && newInput.type !== "number"){
        try{ newInput.setSelectionRange(caretPos, caretPos); }catch(err){}
      }
    }
  }

  scheduleSave(current);
}

function onParticionadoChange(e){
  const rowEl = e.target.closest(".etapa-row");
  const idx = Number(rowEl.dataset.idx);
  const groups = Array.from(rowEl.querySelectorAll(".livro-group"));
  const grpEl = e.target.closest(".livro-group");
  const li = groups.indexOf(grpEl);

  monthData[idx].livros[li].particionado = e.target.checked;
  if(!e.target.checked){
    monthData[idx].livros[li].seqA = "";
    monthData[idx].livros[li].seqB = "";
  }

  renderEtapas();
  updateFilledState(idx);
  updateChipState(idx);
  renderSummary();
  scheduleSave(current);
}

function onRemoveLivro(e){
  const rowEl = e.target.closest(".etapa-row");
  const idx = Number(rowEl.dataset.idx);
  const groups = Array.from(rowEl.querySelectorAll(".livro-group"));
  const grpEl = e.target.closest(".livro-group");
  const li = groups.indexOf(grpEl);

  monthData[idx].livros.splice(li, 1);
  if(monthData[idx].livros.length === 0) monthData[idx].livros.push(emptyLivro());

  renderEtapas();
  updateChipState(idx);
  renderSummary();
  scheduleSave(current);
}

function updateFilledState(idx){
  const etapa = monthData[idx];
  const rowEl = document.querySelector(`.etapa-row[data-idx="${idx}"]`);
  if(!rowEl) return;
  const isFilled = !!(etapa.data || etapa.livros.some(l=> l.livro || l.qtd));
  rowEl.classList.toggle("filled", isFilled);

  const totalEl = rowEl.querySelector(".etapa-total");
  const total = etapaTotal(etapa);
  if(totalEl){
    totalEl.textContent = total > 0 ? `${total} leituras` : "";
  }

  const rightWrap = rowEl.querySelector(".etapa-top-right");
  const hasParticionado = etapa.livros.some(l=> l.particionado);
  let tagEl = rowEl.querySelector(".etapa-tag");
  if(hasParticionado && !tagEl && rightWrap){
    tagEl = document.createElement("span");
    tagEl.className = "etapa-tag";
    tagEl.textContent = "particionado";
    rightWrap.insertBefore(tagEl, rightWrap.firstChild);
  } else if(!hasParticionado && tagEl){
    tagEl.remove();
  }
}

function renderSummary(){
  let etapasLancadas = 0, totalGeral = 0;
  const totals = {};

  monthData.forEach((etapa, i)=>{
    const t = etapaTotal(etapa);
    totals[i+1] = t;
    totalGeral += t;
    if(etapa.data || etapa.livros.some(l=> l.livro || l.qtd)) etapasLancadas++;
  });

  document.getElementById("statEtapas").textContent = etapasLancadas;
  document.getElementById("statTotal").textContent = totalGeral;

  const body = document.getElementById("summaryBody");
  const rows = [];
  for(let i=1;i<=18;i++){
    if(totals[i] > 0){
      rows.push(`<tr><td>Etapa ${i}</td><td class="qty">${totals[i]}</td></tr>`);
    }
  }
  body.innerHTML = rows.length
    ? rows.join("")
    : `<tr class="empty"><td colspan="2">Nenhuma leitura lançada ainda neste mês</td></tr>`;
}

function renderMonthLabel(date){
  const label = date.toLocaleDateString("pt-BR", { month:"long", year:"numeric" });
  document.getElementById("monthLabel").textContent = label;
}

async function renderAll(){
  renderMonthLabel(current);
  await loadMonth(current);
  selectedIdx = 0;
  renderSelector();
  renderEtapas();
  renderSummary();
}

document.getElementById("prevMonth").addEventListener("click", async ()=>{
  current = new Date(current.getFullYear(), current.getMonth()-1, 1);
  await renderAll();
});
document.getElementById("nextMonth").addEventListener("click", async ()=>{
  current = new Date(current.getFullYear(), current.getMonth()+1, 1);
  await renderAll();
});

renderAll();
</script>
</body>
</html>
