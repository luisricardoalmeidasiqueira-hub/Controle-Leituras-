body:before{content:"";position:fixed;inset:0;background:rgba(255,255,255,.72);z-index:0;pointer-events:none}
body>*{position:relative;z-index:1}
header{padding:7px 10px 4px}
h1{margin:0;font-size:24px}
.sub{margin-top:3px;font-size:12px}
.card{background:#fff;margin:5px 8px 9px;padding:9px;border-radius:12px;box-shadow:0 2px 9px #0001}
h2{margin:0 0 7px;font-size:18px}
label{display:block;font-size:14px;font-weight:bold;margin:7px 0 4px}
input,select,button{width:100%;min-height:40px;border-radius:8px;font-size:14px;padding:7px}
input,select{border:1.5px solid #ccc;background:#fff}
button{border:0;font-weight:bold;cursor:pointer}
.save{background:var(--app);color:white;font-size:15px;margin-top:9px}
.etapas{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.etapa{min-height:30px;padding:2px;background:var(--app-light);color:var(--app);border:2px solid var(--app-border);border-radius:10px;font-size:12px}
.etapa.active{background:var(--app);color:#fff}
.section-title{font-size:23px;font-weight:bold;margin:20px 18px 10px}
.reg{border-left:6px solid var(--app);margin:10px 0;padding:14px;background:#fff;border-radius:12px;box-shadow:0 1px 5px #0001;color:#285f31}
.reg b{font-size:19px}
.reg div{margin-top:7px;color:#315e38}
.del{margin-top:12px;background:#fff;border:2px solid var(--app);color:var(--app);min-height:44px}
.empty{text-align:center;color:#777;padding:20px}
.small{font-size:12px;color:#666;margin-top:10px}

.endereco-linha{display:grid;grid-template-columns:1fr 90px;gap:7px}
.exportar-etapa{background:#fff;color:var(--app);border:1.5px solid var(--app);margin-top:8px;width:42px;min-height:38px;padding:4px;font-size:19px;border-radius:9px}

.etapa-select{width:100%;min-height:42px;border:2px solid var(--app-border);border-radius:9px;background:var(--app-light);color:var(--app);font-size:15px;font-weight:bold;padding:7px 10px}

.cor-app{position:relative;margin-top:5px;display:flex;justify-content:flex-end}
.cor-btn{width:38px!important;min-height:34px!important;padding:3px!important;border:1px solid #bbb;background:#fff;font-size:17px!important}
.cores{display:none;position:absolute;right:0;top:38px;z-index:20;background:#fff;padding:6px;border-radius:10px;box-shadow:0 3px 12px #0003;gap:4px}
.cores.aberta{display:flex}
.cores button{width:32px!important;min-height:32px!important;padding:2px!important;border:1px solid #ddd;background:#fff;font-size:17px!important}

  <option value="15">ETAPA 15</option>
  <option value="16">ETAPA 16</option>
  <option value="17">ETAPA 17</option>
  <option value="18">ETAPA 18</option>
</select>

<label>Endereço</label>
<div class="endereco-linha">
  <input id="endereco" placeholder="Nome da rua">
  <input id="numeroCasa" inputmode="numeric" placeholder="Nº">
</div>

<label>Localidade</label>
<input id="localidade" placeholder="Ex: Tatuí">

<label>Número da UC</label>
<input id="uc" inputmode="numeric" placeholder="Ex: 7891234">

<label>Medidor</label>
<input id="medidor" placeholder="Ex: B17844901">

<label>Leitura Corrigida</label>
<input id="leitura" type="number" inputmode="numeric" placeholder="Digite a leitura">

<label>Data da correção da Leitura</label>
<input id="data" type="date">

<button class="save" onclick="salvar()">SALVAR LANÇAMENTO</button>
<div class="small">Os lançamentos ficam separados por etapa. Ao trocar de etapa, somente os registros daquela etapa são exibidos.</div>
</div>

<div class="section-title">Acompanhamento — <span id="etapaLista">Etapa 01</span></div>
<div class="card" id="lista"></div>
<div style="margin:0 8px 14px">
  <button class="exportar-etapa" onclick="exportarEtapa()" aria-label="Exportar etapa" title="Exportar etapa">📄</button>
</div>

<script>

function mostrarCores(){
  document.getElementById('cores').classList.toggle('aberta');
}
function mudarCor(cor,claro,borda){
  document.documentElement.style.setProperty('--app',cor);
  document.documentElement.style.setProperty('--app-light',claro);
  document.documentElement.style.setProperty('--app-border',borda);
  localStorage.setItem('cor_app_leitura',JSON.stringify({cor,claro,borda}));
  document.getElementById('cores').classList.remove('aberta');
}
function carregarCor(){
  try{
    const x=JSON.parse(localStorage.getItem('cor_app_leitura')||'null');
    if(x){
      document.documentElement.style.setProperty('--app',x.cor);
      document.documentElement.style.setProperty('--app-light',x.claro);
      document.documentElement.style.setProperty('--app-border',x.borda);
    }
  }catch(e){}
}
carregarCor();

let etapaAtual=1;
let registros=JSON.parse(localStorage.getItem('correcoes_etapas_1_18')||'[]');


document.getElementById('data').value=new Date().toISOString().slice(0,10);

function selecionarEtapa(n){
  etapaAtual=n;
  const seletor=document.getElementById('etapaSelect');
  if(seletor) seletor.value=String(n);
  document.getElementById('etapaTitulo').textContent='Etapa '+String(n).padStart(2,'0');
  document.getElementById('etapaLista').textContent='Etapa '+String(n).padStart(2,'0');
  document.getElementById('exportEtapaNumero').textContent=String(n).padStart(2,'0');
  render();
}
function salvar(){
  const endereco=document.getElementById('endereco').value.trim();
  const numeroCasa=document.getElementById('numeroCasa').value.trim();
  const localidade=document.getElementById('localidade').value.trim();
  const medidor=document.getElementById('medidor').value.trim();
  const uc=document.getElementById('uc').value.trim();
  const leitura=document.getElementById('leitura').value.trim();
  const data=document.getElementById('data').value;
  if(!endereco||!localidade||!numeroCasa||!medidor||!uc||!leitura){
    alert('Preencha Endereço, Medidor, UC e Leitura Corrigida.');
    return;
  }
  registros.push({id:Date.now(),etapa:etapaAtual,endereco,localidade,numeroCasa,medidor,uc,leitura,data});
  localStorage.setItem('correcoes_etapas_1_18',JSON.stringify(registros));
  document.getElementById('endereco').value='';
  document.getElementById('localidade').value='';
  document.getElementById('numeroCasa').value='';
  document.getElementById('medidor').value='';
  document.getElementById('uc').value='';
  document.getElementById('leitura').value='';
  document.getElementById('data').value=new Date().toISOString().slice(0,10);
  render();
}
function excluir(id){
  if(confirm('Excluir este lançamento?')){
    registros=registros.filter(r=>r.id!==id);
    localStorage.setItem('correcoes_etapas_1_18',JSON.stringify(registros));
    render();
  }
}
function formatarData(d){
  if(!d)return '';
  const p=d.split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d;
}
function render(){
  const lista=document.getElementById('lista');
  const filtrados=registros.filter(r=>Number(r.etapa)===Number(etapaAtual));
  if(!filtrados.length){
    lista.innerHTML='<div class="empty">Nenhum lançamento na Etapa '+String(etapaAtual).padStart(2,'0')+'.</div>';
    return;
  }
  lista.innerHTML=filtrados.slice().reverse().map(r=>`
    <div class="reg">
      <b>${esc(r.endereco)}, ${esc(r.numeroCasa||'')}</b>
      <div>Localidade: ${esc(r.localidade||'')} </div>
      <div>UC: ${esc(r.uc)} • Medidor: ${esc(r.medidor)}</div>
      <div><b>Leitura corrigida:</b> ${esc(r.leitura)}</div>
      <div><b>Data:</b> ${formatarData(r.data)}</div>
      <div><b>Etapa:</b> ${String(r.etapa).padStart(2,'0')}</div>
      <button class="del" onclick="excluir(${r.id})">Excluir</button>
    </div>`).join('');
}

function exportarEtapa(){
  const dados=registros.filter(r=>Number(r.etapa)===Number(etapaAtual));
  if(!dados.length){
    alert('Não há lançamentos nesta etapa para exportar.');
    return;
  }
  const cab=['Etapa','Endereço','Número da casa','Localidade','Número da UC','Medidor','Leitura Corrigida','Data'];
  const linhas=dados.map(r=>[
    String(r.etapa).padStart(2,'0'),
    r.endereco,
    r.numeroCasa||'',
    r.localidade||'',
    r.uc,
    r.medidor,
    r.leitura,
    formatarData(r.data)
  ]);
  const csv=[cab,...linhas].map(row=>row.map(v=>{
    const s=String(v??'').replace(/"/g,'""');
    return `"${s}"`;
  }).join(';')).join('\r\n');
  const blob=new Blob(["\ufeff"+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='lancamentos_etapa_'+String(etapaAtual).padStart(2,'0')+'.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
selecionarEtapa(1);
</script>
</body>
</html>
