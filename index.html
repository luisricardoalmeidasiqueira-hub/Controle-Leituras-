<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d4b35">
<title>Controle de Leituras</title>
<style>
:root{--g:#0d4b35;--g2:#176b4d;--mint:#e8f3ed;--bg:#f4f7f5;--line:#d8e4de;--text:#16362b;--muted:#708078}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
header{background:var(--g);color:#fff;padding:13px 14px 17px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 3px 14px #0003}
.icon{border:0;background:transparent;color:#fff;font-size:25px;width:42px;height:42px;border-radius:11px}.icon:active{background:#fff2}
.logo{font-size:30px}.head{flex:1}.head b{font-size:18px}.head small{display:block;margin-top:3px;color:#d8e9e2;font-size:11px}
main{max-width:700px;margin:auto;padding:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:12px;box-shadow:0 5px 18px #12372b12}
.row{display:flex;gap:9px;align-items:end}.field{flex:1}label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;margin:0 0 5px 2px}
input,select{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);padding:0 12px;font-size:17px;font-weight:650;outline:0}
input:focus,select:focus{border-color:var(--g2);box-shadow:0 0 0 3px #176b4d18}
.date{height:48px;min-width:132px;background:var(--mint);border-radius:12px;padding:7px 10px;display:flex;gap:7px;align-items:center}.date b{font-size:12px}.date small{display:block;color:var(--muted);font-size:10px}
.partition{margin-top:13px;background:#f4f8f6;border:1px solid #dce9e2;border-radius:13px;padding:10px 11px}.check{display:flex;align-items:center;gap:9px;font-weight:850}.check input{width:22px;height:22px;accent-color:var(--g2);margin:0}
.range{display:none;gap:9px;margin-top:10px}.range.show{display:flex}.hint{font-size:10px;color:var(--muted);margin-top:7px}
.save{width:100%;height:48px;border:0;border-radius:12px;background:var(--g2);color:#fff;font-weight:900;margin-top:12px}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--mint);border:1px solid #d7e9df;border-radius:14px;padding:11px 13px}.total span{font-size:11px;font-weight:850;color:var(--muted)}.total strong{font-size:25px;color:var(--g)}
.rhead{display:flex;justify-content:space-between;align-items:center}.rhead h2{font-size:16px;margin:0}.badge{background:var(--mint);color:var(--g);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}
.record{display:grid;grid-template-columns:1fr 43px;gap:10px;align-items:center;background:#f7faf8;border:1px solid #e1ebe5;border-radius:14px;padding:11px;margin-top:8px}
.book{font-size:18px;font-weight:900}.info{font-size:12px;line-height:1.45;color:var(--muted);margin-top:3px}.info b{color:var(--text)}
.del{width:43px;height:43px;border:0;border-radius:11px;background:#fde9e9;color:#c92727;font-size:21px;font-weight:900}.empty{text-align:center;color:var(--muted);font-size:12px;padding:13px}
.drawerShade{display:none;position:fixed;inset:0;background:#0006;z-index:20}.drawerShade.show{display:block}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(295px,82vw);background:#fff;z-index:21;transform:translateX(-105%);transition:.2s;box-shadow:8px 0 28px #0003;padding:16px;padding-top:calc(15px + env(safe-area-inset-top));overflow:auto}.drawer.open{transform:none}
.dh{display:flex;align-items:center;margin-bottom:10px}.dh b{font-size:18px;color:var(--g);flex:1}.close{border:0;background:#edf3f0;border-radius:10px;width:38px;height:38px}
.item{width:100%;display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid #edf1ef;background:#fff;padding:12px 4px;text-align:left;color:var(--text);font-size:14px}.item span{margin-left:auto;color:var(--muted)}
.modalShade{display:none;position:fixed;inset:0;background:#0007;z-index:30;align-items:center;justify-content:center;padding:14px}.modalShade.show{display:flex}.modal{width:min(470px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:18px;padding:15px}.mh{display:flex;align-items:center;margin-bottom:12px}.mh b{flex:1;font-size:16px}
@media(max-width:430px){.row{display:grid;grid-template-columns:1fr}.date{min-width:0}.range .field{min-width:0}}
</style>
</head>
<body>
<header><button class="icon" onclick="openMenu()">☰</button><div class="logo">📚</div><div class="head"><b>Controle de Leituras</b><small>Lançamento por etapa, livro e intervalo</small></div><button class="icon" onclick="options()">⋮</button></header>
<div id="shade" class="drawerShade" onclick="closeMenu()"></div>
<aside id="drawer" class="drawer"><div class="dh"><b>📚 Menu</b><button class="close" onclick="closeMenu()">✕</button></div>
<button class="item" onclick="closeMenu()">📚 Leituras <span>›</span></button>
<button class="item" onclick="report()">📊 Relatório <span>›</span></button>
<button class="item" onclick="exportCSV()">📄 Exportar <span>›</span></button>
<button class="item" onclick="clearAll()">🗑️ Limpar registros <span>›</span></button></aside>

<main>
<section class="card">
<div class="row"><div class="field"><label>Etapa</label><select id="stage"></select></div><div class="date">📅<div><b id="today"></b><small id="weekday"></small></div></div></div>
<div style="margin-top:13px"><label>Livro</label><input id="book" inputmode="numeric" autocomplete="off" placeholder="Digite o número do livro"></div>
<div class="partition"><label class="check"><input id="part" type="checkbox" onchange="rangeToggle()">Particionado</label>
<div id="range" class="range"><div class="field"><label>De</label><input id="from" inputmode="numeric" placeholder="Ex.: 5"></div><div class="field"><label>Até</label><input id="to" inputmode="numeric" placeholder="Ex.: 30"></div></div>
<div class="hint">Marque somente quando for uma parte do livro. Sem limite de números.</div></div>
<div style="margin-top:13px"><label>Quantidade de leituras</label><input id="qty" inputmode="numeric" placeholder="Digite a quantidade"></div>
<button class="save" onclick="saveReading()">💾 &nbsp;Salvar leitura</button>
</section>
<section class="card"><div class="total"><div><span>TOTAL DE LEITURAS NO MÊS</span><div id="month" style="font-size:12px;font-weight:800;margin-top:2px"></div></div><strong id="sum">0</strong></div></section>
<section class="card"><div class="rhead"><h2>📋 Registros da Etapa <span id="stlabel">09</span></h2><span class="badge" id="count">0</span></div><div id="records"></div></section>
<div style="text-align:center;color:#7a8a83;font-size:10px;padding:8px">© 2026 — Controle de Leituras</div>
</main>

<div id="modalShade" class="modalShade" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div>
<script>
const KEY="controle_leituras_v3";let records=JSON.parse(localStorage.getItem(KEY)||"[]");
const st=document.getElementById("stage");for(let i=1;i<=18;i++){let o=document.createElement("option");o.value=String(i).padStart(2,"0");o.textContent=String(i).padStart(2,"0");st.appendChild(o)}st.value="09";st.onchange=render;
function persist(){localStorage.setItem(KEY,JSON.stringify(records))}
function rangeToggle(){document.getElementById("range").classList.toggle("show",document.getElementById("part").checked)}
function clearFields(){book.value="";qty.value="";part.checked=false;from.value="";to.value="";rangeToggle()}
function saveReading(){let b=book.value.trim(),q=qty.value.trim(),p=part.checked,a=from.value.trim(),z=to.value.trim();if(!b)return alert("Digite o número do livro.");if(!q)return alert("Digite a quantidade.");if(p&&(!a||!z))return alert("Informe o intervalo DE e ATÉ.");let d=new Date();records.unshift({id:Date.now(),stage:st.value,book:b,qty:parseInt(q.replace(/\D/g,""))||0,part:p,from:a,to:z,date:d.toISOString(),time:d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})});persist();clearFields();render();book.focus()}
function render(){let s=st.value,list=records.filter(r=>r.stage===s);stlabel.textContent=s;count.textContent=list.length+" registro"+(list.length===1?"":"s");recordsEl=document.getElementById("records");recordsEl.innerHTML=list.length?list.map(r=>{let d=new Date(r.date);return `<div class="record"><div><div class="book">${esc(r.book)}</div><div class="info">${r.part?`Particionado: <b>${esc(r.from)} até ${esc(r.to)}</b>`:"Livro completo"}<br><b>Quantidade:</b> ${r.qty.toLocaleString("pt-BR")} · ${d.toLocaleDateString("pt-BR")} · ${r.time}</div></div><button class="del" onclick="del(${r.id})">✕</button></div>`}).join(""):'<div class="empty">Nenhuma leitura lançada nesta etapa.</div>';let n=new Date(),t=records.filter(r=>{let d=new Date(r.date);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}).reduce((x,r)=>x+r.qty,0);sum.textContent=t.toLocaleString("pt-BR")}
function del(id){if(confirm("Excluir somente esta leitura?")){records=records.filter(r=>r.id!==id);persist();render()}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function openMenu(){drawer.classList.add("open");shade.classList.add("show")}function closeMenu(){drawer.classList.remove("open");shade.classList.remove("show")}
function options(){openModal('<div class="mh"><b>Opções</b><button class="close" onclick="closeModal()">✕</button></div><p style="font-size:13px;color:var(--muted)">O lançamento só é salvo quando você toca em <b>Salvar leitura</b>.</p>')}
function report(){openMenu();closeMenu();let total=records.reduce((x,r)=>x+r.qty,0);openModal(`<div class="mh"><b>📊 Relatório</b><button class="close" onclick="closeModal()">✕</button></div><div class="total"><div><span>REGISTROS</span><div>${records.length}</div></div><strong>${total.toLocaleString("pt-BR")}</strong></div>`)}
function exportCSV(){if(!records.length)return alert("Não há registros para exportar.");let c="Etapa;Livro;Particionado;De;Até;Quantidade;Data;Hora\n";records.forEach(r=>c+=`${r.stage};${r.book};${r.part?"SIM":"NÃO"};${r.from||""};${r.to||""};${r.qty};${new Date(r.date).toLocaleDateString("pt-BR")};${r.time}\n`);let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+c],{type:"text/csv"}));a.download="controle_leituras.csv";a.click()}
function openModal(c){modal.innerHTML=c;modalShade.classList.add("show")}function closeModal(){modalShade.classList.remove("show")}
let d=new Date();today.textContent=d.toLocaleDateString("pt-BR");weekday.textContent=d.toLocaleDateString("pt-BR",{weekday:"long"});month.textContent=d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});render();
</script>
</body></html>
